<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matchstick Equation — Pop Pop's Games</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <h1>Matchstick Equation</h1>

    <div id="score" class="score" aria-label="Score">
      <div class="score-side">
        <button id="name-btn" class="score-label name-btn" aria-label="Set player name">Guest</button>
        <input id="name-input" class="name-input" type="text" placeholder="Enter name…" autocomplete="off" hidden>
        <ul id="name-list" class="name-list" hidden></ul>
        <span id="score-player" class="score-num">0</span>
      </div>
      <span class="score-vs">vs</span>
      <div class="score-side">
        <span class="score-label">Computer</span>
        <span id="score-hangman" class="score-num">0</span>
      </div>
    </div>

    <div id="level-toggle" class="level-toggle" aria-label="Difficulty"></div>

    <p id="status" class="status">Move one matchstick to fix the equation!</p>

    <div id="equation" class="equation" aria-label="Matchstick equation"></div>

    <div class="stats">
      <span>Moves used: <strong id="moves">0</strong></span>
    </div>

    <div id="result" class="result" hidden></div>

    <div class="actions">
      <button id="show-me" class="action-btn secondary actions-inactive" aria-hidden="true">Show Me</button>
      <button id="reset-puzzle" class="action-btn secondary">Reset</button>
      <button id="new-game" class="new-game">New Game</button>
    </div>

    <div class="actions">
      <button id="solve-for-me" class="action-btn secondary">Solve One For Me</button>
      <button id="give-up" class="action-btn secondary">I Give Up</button>
    </div>

    <dialog id="solve-dialog" class="solve-dialog">
      <form id="solve-form">
        <h2>Solve One For Me</h2>
        <p>Type an equation using digits, + or -, and =:</p>
        <input id="solve-input" type="text" placeholder="e.g. 3 - 3 = 1" autocomplete="off" maxlength="20">
        <p id="solve-error" class="solve-error" hidden></p>
        <div class="solve-actions">
          <button type="button" id="solve-cancel" class="action-btn secondary">Cancel</button>
          <button type="submit" id="solve-submit" class="new-game">Solve It</button>
        </div>
      </form>
    </dialog>

    <a href="/" class="home-btn" aria-label="Home">
      <img src="/logo.png" alt="Pop Pop's Games">
    </a>
  </main>
  <script src="script.js"></script>
</body>
</html>
