<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Match — Pop Pop's Games</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <h1>Memory Match</h1>

    <div id="score" class="score" aria-label="Score">
      <div class="score-side">
        <button id="name-btn" class="score-label name-btn" aria-label="Set player name">Guest</button>
        <input id="name-input" class="name-input" type="text" placeholder="Enter name…" autocomplete="off" hidden>
        <ul id="name-list" class="name-list" hidden></ul>
        <span id="score-player" class="score-num">0</span>
      </div>
      <span class="score-vs">vs</span>
      <div class="score-side">
        <span class="score-label">Computer</span>
        <span id="score-hangman" class="score-num">0</span>
      </div>
    </div>

    <div class="theme-toggle">
      <button id="theme-farm" class="theme-btn active" data-theme="farm">🐄 Farm</button>
      <button id="theme-zoo"  class="theme-btn"        data-theme="zoo">🦁 Zoo</button>
    </div>

    <div class="level-toggle">
      <button id="level-easy"   class="level-btn"        data-level="easy">Easy</button>
      <button id="level-medium" class="level-btn active" data-level="medium">Medium</button>
      <button id="level-hard"   class="level-btn"        data-level="hard">Hard</button>
    </div>

    <div class="stats">
      <span>Moves: <strong id="moves">0</strong></span>
      <span>Pairs: <strong id="matched">0</strong> / 10</span>
      <span>Par: <strong id="par">25</strong></span>
    </div>

    <div id="board" class="board" aria-label="Game board"></div>

    <div id="result" class="result" hidden></div>

    <button id="new-game" class="new-game">New Game</button>

    <a href="/" class="home-btn" aria-label="Home">
      <img src="/logo.png" alt="Pop Pop's Games">
    </a>
  </main>
  <script src="script.js"></script>
</body>
</html>
