<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wordle — Pop Pop's Games</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <h1>Wordle</h1>

    <!-- Score bar -->
    <div id="score" class="score" aria-label="Score">
      <div class="score-side">
        <button id="name-btn" class="score-label name-btn"
                title="Tap to set your name (blank = guest)">Guest</button>
        <input id="name-input" class="name-input" type="text"
               maxlength="20" placeholder="name…" autocomplete="off" hidden>
        <ul id="name-list" class="name-list" hidden></ul>
        <span id="score-player" class="score-num">0</span>
      </div>
      <span class="score-vs">vs</span>
      <div class="score-side">
        <span class="score-label">Computer</span>
        <span id="score-hangman" class="score-num">0</span>
      </div>
    </div>

    <!-- Timer -->
    <p class="timer-row">Time: <strong id="timer">0:00</strong></p>

    <!-- 6×5 game board -->
    <div id="board" class="board" aria-label="Wordle board"></div>

    <!-- Status message -->
    <p id="status" class="status"></p>

    <!-- On-screen keyboard -->
    <div id="keyboard" class="keyboard">
      <div class="kb-row" data-row="QWERTYUIOP"></div>
      <div class="kb-row" data-row="ASDFGHJKL"></div>
      <div class="kb-row kb-row-bottom">
        <button class="key key-wide" data-key="Enter">Enter</button>
        <button class="key" data-key="Z">Z</button>
        <button class="key" data-key="X">X</button>
        <button class="key" data-key="C">C</button>
        <button class="key" data-key="V">V</button>
        <button class="key" data-key="B">B</button>
        <button class="key" data-key="N">N</button>
        <button class="key" data-key="M">M</button>
        <button class="key key-wide" data-key="Backspace">⌫</button>
      </div>
    </div>

    <div class="actions">
      <button id="btn-new" class="action-btn secondary">New Game</button>
    </div>

    <!-- Per-player guess history -->
    <section class="guess-history" aria-label="Your guess history">
      <h2>Your Guess History</h2>
      <div id="guess-history" class="history-bars"></div>
    </section>

    <a href="/" class="home-btn">
      <img src="/logo.png" alt="Pop Pop's Games">
    </a>
  </main>
  <script src="/timer.js"></script>
  <script src="script.js"></script>
</body>
</html>
