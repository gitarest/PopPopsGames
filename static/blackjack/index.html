<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>21 — Pop Pop's Games</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <h1>21</h1>

    <!-- Persistent win/loss score -->
    <div id="score" class="score" aria-label="Score">
      <div class="score-side">
        <button id="name-btn" class="score-label name-btn"
                title="Tap to set your name (blank = guest)">Guest</button>
        <input id="name-input" class="name-input" type="text"
               maxlength="20" placeholder="name…" autocomplete="off" hidden>
        <ul id="name-list" class="name-list" hidden></ul>
        <span id="score-player" class="score-num">0</span>
      </div>
      <span class="score-vs">vs</span>
      <div class="score-side">
        <span class="score-label">Computer</span>
        <span id="score-hangman" class="score-num">0</span>
      </div>
    </div>

    <!-- Running tally for this deck -->
    <div class="tally">
      <span><span id="tally-name">You</span>: <strong id="tally-player">0</strong></span>
      <span>Ties: <strong id="tally-ties">0</strong></span>
      <span>Dealer: <strong id="tally-dealer">0</strong></span>
      <span class="cards-left"><strong id="cards-remaining">156</strong> cards left</span>
    </div>

    <!-- Dealer -->
    <div class="hand-section">
      <p class="hand-label">Dealer <span id="dealer-value" class="hand-value"></span></p>
      <div id="dealer-hand" class="hand"></div>
    </div>

    <p id="status" class="status">Dealing…</p>

    <!-- Player -->
    <div class="hand-section">
      <p class="hand-label">You <span id="player-value" class="hand-value"></span></p>
      <div id="player-hand" class="hand"></div>
    </div>

    <!-- Actions -->
    <div class="actions">
      <button id="btn-hit"   class="action-btn">Hit</button>
      <button id="btn-stand" class="action-btn">Stand</button>
      <button id="btn-deal"  class="action-btn secondary">Next Hand</button>
      <button id="btn-new"   class="action-btn secondary">New Deck</button>
    </div>

    <a href="/" class="home-btn">
      <img src="/logo.png" alt="Pop Pop's Games">
    </a>
  </main>
  <script src="script.js"></script>
</body>
</html>
