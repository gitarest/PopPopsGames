<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tetris — Pop Pop's Games</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <h1>Tetris</h1>

    <div id="score" class="score" aria-label="Score">
      <div class="score-side">
        <button id="name-btn" class="score-label name-btn" aria-label="Set player name">Guest</button>
        <input id="name-input" class="name-input" type="text" placeholder="Enter name…" autocomplete="off" hidden>
        <ul id="name-list" class="name-list" hidden></ul>
        <span id="score-player" class="score-num">0</span>
      </div>
      <span class="score-vs">vs</span>
      <div class="score-side">
        <span class="score-label">Computer</span>
        <span id="score-hangman" class="score-num">0</span>
      </div>
    </div>

    <div id="level-toggle" class="level-toggle" aria-label="Difficulty"></div>

    <div class="play-area">
      <div id="board" class="board" aria-label="Tetris board"></div>
      <div class="side-panel">
        <div class="panel-block">
          <span class="panel-label">Next</span>
          <div id="next-piece" class="next-piece"></div>
        </div>
        <div class="panel-block">
          <span class="panel-label">Lines</span>
          <span id="lines" class="panel-num">0</span>
        </div>
        <div class="panel-block">
          <span class="panel-label">Level</span>
          <span id="level-num" class="panel-num">1</span>
        </div>
        <div class="panel-block">
          <span class="panel-label">Best</span>
          <span id="best" class="panel-num">0</span>
        </div>
      </div>
    </div>

    <div id="result" class="result" hidden></div>

    <div class="controls">
      <div class="control-row">
        <button id="btn-left" class="ctrl-btn" aria-label="Move left">⬅️</button>
        <button id="btn-rotate" class="ctrl-btn" aria-label="Rotate">🔁</button>
        <button id="btn-right" class="ctrl-btn" aria-label="Move right">➡️</button>
      </div>
      <div class="control-row">
        <button id="btn-soft" class="ctrl-btn ctrl-wide" aria-label="Soft drop">⬇️ Soft Drop</button>
        <button id="btn-hard" class="ctrl-btn ctrl-wide" aria-label="Hard drop">⏬ Hard Drop</button>
      </div>
    </div>

    <button id="new-game" class="new-game">New Game</button>

    <a href="/" class="home-btn" aria-label="Home">
      <img src="/logo.png" alt="Pop Pop's Games">
    </a>
  </main>
  <script src="script.js"></script>
</body>
</html>
