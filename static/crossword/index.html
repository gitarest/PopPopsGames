<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kids Crossword — Pop Pop's Games</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <h1>Kids Crossword</h1>

    <div id="score" class="score" aria-label="Score">
      <div class="score-side">
        <button id="name-btn" class="score-label name-btn" aria-label="Set player name">Guest</button>
        <input id="name-input" class="name-input" type="text" placeholder="Enter name…" autocomplete="off" hidden>
        <ul id="name-list" class="name-list" hidden></ul>
        <span id="score-player" class="score-num">0</span>
      </div>
      <span class="score-vs">vs</span>
      <div class="score-side">
        <span class="score-label">Computer</span>
        <span id="score-hangman" class="score-num">0</span>
      </div>
    </div>

    <div id="level-toggle" class="level-toggle" aria-label="Difficulty"></div>

    <div class="stats">
      <span>Time: <strong id="timer">0:00</strong></span>
      <span>Hints used: <strong id="hints">0</strong></span>
    </div>

    <div id="grid" class="grid" aria-label="Crossword grid"></div>

    <div class="clue-lists">
      <div class="clue-col">
        <h2>Across</h2>
        <ul id="clues-across" class="clue-list"></ul>
      </div>
      <div class="clue-col">
        <h2>Down</h2>
        <ul id="clues-down" class="clue-list"></ul>
      </div>
    </div>

    <div id="result" class="result" hidden></div>

    <div class="actions">
      <button id="btn-reveal" class="action-btn secondary">Reveal Letter</button>
      <button id="new-game" class="new-game">New Game</button>
    </div>

    <a href="/" class="home-btn" aria-label="Home">
      <img src="/logo.png" alt="Pop Pop's Games">
    </a>
  </main>
  <script src="/timer.js"></script>
  <script src="script.js"></script>
</body>
</html>
