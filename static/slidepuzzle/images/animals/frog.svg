<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="pond" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#sky)"/>
  <!-- sun with rays -->
  <g stroke="#facc15" stroke-width="6" stroke-linecap="round">
    <line x1="70" y1="10" x2="70" y2="25"/><line x1="70" y1="115" x2="70" y2="130"/>
    <line x1="10" y1="70" x2="25" y2="70"/><line x1="115" y1="70" x2="130" y2="70"/>
    <line x1="28" y1="28" x2="38" y2="38"/><line x1="102" y1="102" x2="112" y2="112"/>
    <line x1="112" y1="28" x2="102" y2="38"/><line x1="38" y1="102" x2="28" y2="112"/>
  </g>
  <circle cx="70" cy="70" r="35" fill="#fde047"/>
  <!-- clouds -->
  <g fill="#fff">
    <circle cx="260" cy="60" r="22"/><circle cx="290" cy="50" r="28"/><circle cx="322" cy="62" r="20"/><rect x="258" y="60" width="66" height="22" rx="11"/>
  </g>
  <!-- cattails -->
  <g stroke="#15803d" stroke-width="5">
    <line x1="350" y1="250" x2="350" y2="130"/><line x1="375" y1="250" x2="375" y2="160"/><line x1="30" y1="250" x2="30" y2="150"/>
  </g>
  <g fill="#78350f">
    <rect x="343" y="125" width="14" height="40" rx="7"/><rect x="368" y="155" width="14" height="36" rx="7"/><rect x="23" y="145" width="14" height="38" rx="7"/>
  </g>
  <!-- pond -->
  <rect y="230" width="400" height="170" fill="url(#pond)"/>
  <g stroke="#bae6fd" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7">
    <path d="M30,270 q15,-6 30,0"/><path d="M320,300 q15,-6 30,0"/><path d="M60,370 q15,-6 30,0"/><path d="M300,380 q15,-6 30,0"/>
  </g>
  <!-- lily pad -->
  <ellipse cx="200" cy="300" rx="150" ry="50" fill="#22c55e"/>
  <!-- pink flower -->
  <g fill="#f472b6"><ellipse cx="80" cy="300" rx="10" ry="20"/><ellipse cx="65" cy="306" rx="9" ry="16" transform="rotate(-40 65 306)"/><ellipse cx="95" cy="306" rx="9" ry="16" transform="rotate(40 95 306)"/></g>
  <circle cx="80" cy="310" r="5" fill="#fde047"/>
  <!-- frog body -->
  <ellipse cx="210" cy="275" rx="85" ry="55" fill="#4ade80"/>
  <ellipse cx="210" cy="290" rx="55" ry="35" fill="#bbf7d0"/>
  <!-- legs -->
  <ellipse cx="135" cy="305" rx="35" ry="18" fill="#22c55e"/>
  <ellipse cx="285" cy="305" rx="35" ry="18" fill="#22c55e"/>
  <g fill="#16a34a"><circle cx="160" cy="318" r="8"/><circle cx="175" cy="320" r="8"/><circle cx="245" cy="320" r="8"/><circle cx="260" cy="318" r="8"/></g>
  <!-- head -->
  <ellipse cx="210" cy="215" rx="80" ry="50" fill="#4ade80"/>
  <circle cx="165" cy="170" r="30" fill="#4ade80"/>
  <circle cx="255" cy="170" r="30" fill="#4ade80"/>
  <circle cx="165" cy="170" r="20" fill="#fff"/>
  <circle cx="255" cy="170" r="20" fill="#fff"/>
  <circle cx="170" cy="173" r="10" fill="#1c1917"/>
  <circle cx="250" cy="173" r="10" fill="#1c1917"/>
  <circle cx="173" cy="169" r="3" fill="#fff"/>
  <circle cx="253" cy="169" r="3" fill="#fff"/>
  <!-- smile and cheeks -->
  <path d="M160,225 Q210,262 260,225" stroke="#14532d" stroke-width="5" fill="none" stroke-linecap="round"/>
  <ellipse cx="150" cy="225" rx="12" ry="7" fill="#f9a8d4"/>
  <ellipse cx="270" cy="225" rx="12" ry="7" fill="#f9a8d4"/>
  <circle cx="200" cy="205" r="3" fill="#14532d"/><circle cx="220" cy="205" r="3" fill="#14532d"/>
</svg>
