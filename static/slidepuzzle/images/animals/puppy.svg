<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#fef3c7"/>
  <!-- sky stripe and clouds -->
  <rect width="400" height="230" fill="#93c5fd"/>
  <g fill="#fff">
    <circle cx="70" cy="60" r="20"/><circle cx="95" cy="50" r="26"/><circle cx="125" cy="62" r="18"/><rect x="68" y="60" width="60" height="20" rx="10"/>
  </g>
  <!-- rainbow -->
  <g fill="none" stroke-width="12">
    <path d="M220,230 A110,110 0 0,1 440,230" stroke="#ef4444"/>
    <path d="M232,230 A98,98 0 0,1 428,230" stroke="#f97316"/>
    <path d="M244,230 A86,86 0 0,1 416,230" stroke="#facc15"/>
    <path d="M256,230 A74,74 0 0,1 404,230" stroke="#22c55e"/>
    <path d="M268,230 A62,62 0 0,1 392,230" stroke="#3b82f6"/>
  </g>
  <!-- picket fence -->
  <g fill="#fff" stroke="#d6d3d1" stroke-width="2">
    <rect x="0" y="190" width="400" height="12"/>
    <path d="M10,240 L10,170 L22,158 L34,170 L34,240 Z"/><path d="M60,240 L60,170 L72,158 L84,170 L84,240 Z"/>
    <path d="M110,240 L110,170 L122,158 L134,170 L134,240 Z"/><path d="M160,240 L160,170 L172,158 L184,170 L184,240 Z"/>
    <path d="M210,240 L210,170 L222,158 L234,170 L234,240 Z"/><path d="M260,240 L260,170 L272,158 L284,170 L284,240 Z"/>
    <path d="M310,240 L310,170 L322,158 L334,170 L334,240 Z"/><path d="M360,240 L360,170 L372,158 L384,170 L384,240 Z"/>
  </g>
  <!-- grass -->
  <rect y="230" width="400" height="170" fill="#4ade80"/>
  <g stroke="#16a34a" stroke-width="3" stroke-linecap="round">
    <path d="M20,300 l5,-12 M30,300 l-3,-14 M360,360 l5,-12 M370,360 l-3,-14 M60,380 l5,-12 M330,280 l-3,-14"/>
  </g>
  <!-- ball -->
  <circle cx="335" cy="330" r="30" fill="#ef4444"/>
  <path d="M305,330 Q335,310 365,330" stroke="#fff" stroke-width="6" fill="none"/>
  <!-- bone -->
  <g fill="#fafaf9" stroke="#d6d3d1" stroke-width="2">
    <rect x="40" y="345" width="60" height="14" rx="7"/>
    <circle cx="40" cy="345" r="10"/><circle cx="40" cy="359" r="10"/><circle cx="100" cy="345" r="10"/><circle cx="100" cy="359" r="10"/>
  </g>
  <!-- body -->
  <ellipse cx="200" cy="320" rx="75" ry="55" fill="#d97706"/>
  <ellipse cx="200" cy="335" rx="40" ry="35" fill="#fef3c7"/>
  <ellipse cx="160" cy="370" rx="22" ry="13" fill="#fef3c7"/>
  <ellipse cx="240" cy="370" rx="22" ry="13" fill="#fef3c7"/>
  <!-- collar -->
  <path d="M140,262 Q200,290 260,262 L262,276 Q200,305 138,276 Z" fill="#2563eb"/>
  <circle cx="200" cy="295" r="11" fill="#facc15" stroke="#ca8a04" stroke-width="2"/>
  <!-- head -->
  <ellipse cx="200" cy="190" rx="80" ry="72" fill="#d97706"/>
  <!-- floppy ears -->
  <path d="M130,150 Q85,160 95,250 Q120,250 140,200 Z" fill="#78350f"/>
  <path d="M270,150 Q315,160 305,250 Q280,250 260,200 Z" fill="#78350f"/>
  <!-- eye patch -->
  <ellipse cx="235" cy="175" rx="28" ry="26" fill="#92400e"/>
  <!-- muzzle -->
  <ellipse cx="200" cy="225" rx="45" ry="33" fill="#fef3c7"/>
  <!-- eyes -->
  <circle cx="168" cy="175" r="12" fill="#1c1917"/>
  <circle cx="232" cy="175" r="12" fill="#1c1917"/>
  <circle cx="172" cy="170" r="4" fill="#fff"/>
  <circle cx="236" cy="170" r="4" fill="#fff"/>
  <!-- nose, mouth, tongue -->
  <ellipse cx="200" cy="208" rx="16" ry="11" fill="#1c1917"/>
  <path d="M200,219 L200,232 M200,232 Q186,244 176,234 M200,232 Q214,244 224,234" stroke="#1c1917" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M192,240 Q200,262 208,240 Z" fill="#f43f5e"/>
</svg>
