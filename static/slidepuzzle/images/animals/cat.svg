<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- wallpaper with polka dots -->
  <rect width="400" height="400" fill="#bae6fd"/>
  <g fill="#7dd3fc">
    <circle cx="30" cy="30" r="10"/><circle cx="110" cy="30" r="10"/><circle cx="190" cy="30" r="10"/><circle cx="270" cy="30" r="10"/><circle cx="350" cy="30" r="10"/>
    <circle cx="70" cy="90" r="10"/><circle cx="150" cy="90" r="10"/><circle cx="230" cy="90" r="10"/><circle cx="310" cy="90" r="10"/><circle cx="390" cy="90" r="10"/>
    <circle cx="30" cy="150" r="10"/><circle cx="350" cy="150" r="10"/>
    <circle cx="70" cy="210" r="10"/><circle cx="390" cy="210" r="10"/>
  </g>
  <!-- window -->
  <rect x="270" y="120" width="110" height="110" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="8"/>
  <line x1="325" y1="120" x2="325" y2="230" stroke="#92400e" stroke-width="6"/>
  <line x1="270" y1="175" x2="380" y2="175" stroke="#92400e" stroke-width="6"/>
  <circle cx="300" cy="148" r="14" fill="#fbbf24"/>
  <!-- floor and rug -->
  <rect y="290" width="400" height="110" fill="#b45309"/>
  <g stroke="#92400e" stroke-width="3"><line x1="0" y1="330" x2="400" y2="330"/><line x1="0" y1="370" x2="400" y2="370"/></g>
  <ellipse cx="190" cy="350" rx="170" ry="38" fill="#dc2626"/>
  <ellipse cx="190" cy="350" rx="140" ry="26" fill="#fca5a5"/>
  <!-- yarn ball -->
  <circle cx="340" cy="340" r="26" fill="#a855f7"/>
  <path d="M318,328 Q340,345 362,328 M316,345 Q340,360 364,345 M330,316 Q345,340 332,364" stroke="#e9d5ff" stroke-width="3" fill="none"/>
  <path d="M316,350 Q280,375 250,360" stroke="#a855f7" stroke-width="3" fill="none"/>
  <!-- tail -->
  <path d="M250,330 Q320,320 300,250 Q290,220 310,200" stroke="#71717a" stroke-width="20" fill="none" stroke-linecap="round"/>
  <!-- body -->
  <ellipse cx="190" cy="305" rx="80" ry="55" fill="#a1a1aa"/>
  <path d="M150,280 L160,300 M190,270 L195,295 M230,280 L222,300" stroke="#71717a" stroke-width="8" stroke-linecap="round"/>
  <ellipse cx="190" cy="320" rx="38" ry="32" fill="#f4f4f5"/>
  <ellipse cx="150" cy="352" rx="22" ry="12" fill="#f4f4f5"/>
  <ellipse cx="230" cy="352" rx="22" ry="12" fill="#f4f4f5"/>
  <!-- ears -->
  <path d="M110,170 L120,80 L175,135 Z" fill="#a1a1aa"/>
  <path d="M270,170 L260,80 L205,135 Z" fill="#a1a1aa"/>
  <path d="M123,155 L128,105 L160,138 Z" fill="#f9a8d4"/>
  <path d="M257,155 L252,105 L220,138 Z" fill="#f9a8d4"/>
  <!-- head -->
  <ellipse cx="190" cy="185" rx="90" ry="75" fill="#a1a1aa"/>
  <path d="M170,115 L175,140 M190,112 L190,140 M210,115 L205,140" stroke="#71717a" stroke-width="7" stroke-linecap="round"/>
  <ellipse cx="190" cy="220" rx="45" ry="32" fill="#f4f4f5"/>
  <!-- eyes -->
  <ellipse cx="155" cy="180" rx="18" ry="20" fill="#84cc16"/>
  <ellipse cx="225" cy="180" rx="18" ry="20" fill="#84cc16"/>
  <ellipse cx="155" cy="180" rx="6" ry="16" fill="#1c1917"/>
  <ellipse cx="225" cy="180" rx="6" ry="16" fill="#1c1917"/>
  <circle cx="160" cy="172" r="4" fill="#fff"/>
  <circle cx="230" cy="172" r="4" fill="#fff"/>
  <!-- nose, mouth, whiskers -->
  <path d="M180,208 L200,208 L190,220 Z" fill="#ec4899"/>
  <path d="M190,220 Q180,235 170,228 M190,220 Q200,235 210,228" stroke="#3f3f46" stroke-width="3" fill="none" stroke-linecap="round"/>
  <g stroke="#3f3f46" stroke-width="2.5" stroke-linecap="round">
    <line x1="150" y1="215" x2="90" y2="205"/><line x1="150" y1="225" x2="92" y2="230"/>
    <line x1="230" y1="215" x2="290" y2="205"/><line x1="230" y1="225" x2="288" y2="230"/>
  </g>
</svg>
