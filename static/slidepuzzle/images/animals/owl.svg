<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="night" cx="0.75" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#night)"/>
  <!-- big moon -->
  <circle cx="300" cy="90" r="60" fill="#fef9c3"/>
  <circle cx="280" cy="70" r="10" fill="#fde68a"/>
  <circle cx="320" cy="110" r="14" fill="#fde68a"/>
  <circle cx="325" cy="65" r="6" fill="#fde68a"/>
  <!-- stars -->
  <g fill="#fef08a">
    <path d="M50,50 l4,10 10,4 -10,4 -4,10 -4,-10 -10,-4 10,-4 Z"/>
    <path d="M150,30 l3,7 7,3 -7,3 -3,7 -3,-7 -7,-3 7,-3 Z"/>
    <path d="M110,120 l3,7 7,3 -7,3 -3,7 -3,-7 -7,-3 7,-3 Z"/>
    <path d="M370,200 l3,7 7,3 -7,3 -3,7 -3,-7 -7,-3 7,-3 Z"/>
    <path d="M30,230 l3,7 7,3 -7,3 -3,7 -3,-7 -7,-3 7,-3 Z"/>
  </g>
  <!-- leaves -->
