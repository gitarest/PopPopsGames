  <path d="M120,150 L105,80 L165,130 Z" fill="#854d0e"/>
  <path d="M280,150 L295,80 L235,130 Z" fill="#854d0e"/>
  <!-- head -->
  <ellipse cx="200" cy="170" rx="95" ry="70" fill="#a16207"/>
  <!-- eye discs -->
  <circle cx="160" cy="170" r="42" fill="#fef3c7"/>
  <circle cx="240" cy="170" r="42" fill="#fef3c7"/>
  <circle cx="160" cy="170" r="26" fill="#f59e0b"/>
  <circle cx="240" cy="170" r="26" fill="#f59e0b"/>
  <circle cx="160" cy="170" r="14" fill="#1c1917"/>
  <circle cx="240" cy="170" r="14" fill="#1c1917"/>
  <circle cx="166" cy="163" r="6" fill="#fff"/>
  <circle cx="246" cy="163" r="6" fill="#fff"/>
  <!-- beak -->
  <path d="M188,198 L212,198 L200,225 Z" fill="#f97316"/>
  <!-- feet -->
  <g fill="#f97316">
    <ellipse cx="170" cy="345" rx="8" ry="12"/><ellipse cx="185" cy="347" rx="8" ry="12"/>
    <ellipse cx="215" cy="347" rx="8" ry="12"/><ellipse cx="230" cy="345" rx="8" ry="12"/>
