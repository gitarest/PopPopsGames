  <ellipse cx="200" cy="275" rx="62" ry="72" fill="#fde68a"/>
  <g fill="none" stroke="#ca8a04" stroke-width="4" stroke-linecap="round">
    <path d="M170,250 q8,8 16,0 M204,250 q8,8 16,0 M187,275 q8,8 16,0 M170,300 q8,8 16,0 M204,300 q8,8 16,0 M187,325 q8,8 16,0"/>
  </g>
  <!-- wings -->
  <path d="M110,200 Q70,280 120,340 Q130,270 110,200 Z" fill="#854d0e"/>
  <path d="M290,200 Q330,280 280,340 Q270,270 290,200 Z" fill="#854d0e"/>
