    <ellipse cx="40" cy="300" rx="30" ry="14" transform="rotate(-25 40 300)"/>
    <ellipse cx="370" cy="325" rx="30" ry="14" transform="rotate(20 370 325)"/>
    <ellipse cx="330" cy="355" rx="24" ry="11" transform="rotate(-15 330 355)"/>
  </g>
  <!-- branch -->
  <path d="M0,330 Q200,300 400,345 L400,370 Q200,325 0,355 Z" fill="#78350f"/>
