<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pop Pop's Games</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="launcher">
    <img src="/logo.png" alt="Pop Pop's Games" class="logo">

    <!-- Player name + running total across all games -->
    <div id="score" class="score" aria-label="Score">
      <div class="score-side">
        <span class="score-label">Player</span>
        <div class="name-btn-wrap">
          <svg class="pencil-icon" viewBox="0 0 14 14" width="13" height="13" aria-hidden="true">
            <g transform="translate(7,7) rotate(-45)">
              <rect x="-2" y="-6" width="4" height="2.5" rx="1" fill="#fca5a5"/>
              <rect x="-2" y="-3.5" width="4" height="7" fill="#fbbf24"/>
              <polygon points="-2,3.5 2,3.5 0,6.5" fill="#d97706"/>
              <polygon points="-0.8,5.8 0.8,5.8 0,7.5" fill="#475569"/>
            </g>
          </svg>
          <button id="name-btn" class="name-btn"
                  title="Tap to set your name (blank = guest)">Guest</button>
        </div>
        <input id="name-input" class="name-input" type="text"
               maxlength="20" placeholder="name…" autocomplete="off" hidden>
        <ul id="name-list" class="name-list" hidden></ul>
        <span id="score-player" class="score-num">0</span>
      </div>
      <span class="score-vs">vs</span>
      <div class="score-side">
        <span class="score-label">Computer</span>
        <span id="score-hangman" class="score-num">0</span>
      </div>
    </div>

    <p class="choose-label">Choose a game</p>

    <div class="games-grid">
      <a href="/hangman" class="game-card">
        <span class="game-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 68" width="56" height="68"
               style="display:block;margin:0 auto" aria-hidden="true">
            <!-- Gallows -->
            <line x1="2"  y1="53" x2="54" y2="53" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="11" y1="53" x2="11" y2="3"  stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="11" y1="3"  x2="40" y2="3"  stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="11" y1="14" x2="20" y2="3"  stroke="#64748b" stroke-width="2"   stroke-linecap="round"/>
            <line x1="40" y1="3"  x2="40" y2="10" stroke="#94a3b8" stroke-width="2"   stroke-linecap="round"/>
            <!-- Head -->
            <circle cx="40" cy="16" r="6" fill="none" stroke="#e2e8f0" stroke-width="2"/>
            <!-- Body -->
            <line x1="40" y1="22" x2="40" y2="36" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>
            <!-- Arms -->
            <line x1="40" y1="26" x2="32" y2="33" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>
            <line x1="40" y1="26" x2="48" y2="33" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>
            <!-- One leg (other missing — game still in play) -->
            <line x1="40" y1="36" x2="33" y2="47" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>
            <!-- Word: C A _ -->
            <text x="13" y="64" font-size="9" font-family="monospace" font-weight="bold" fill="#4ade80" text-anchor="middle">C</text>
            <line x1="9"  y1="66" x2="17" y2="66" stroke="#4ade80" stroke-width="1.2" stroke-linecap="round"/>
            <text x="28" y="64" font-size="9" font-family="monospace" font-weight="bold" fill="#4ade80" text-anchor="middle">A</text>
            <line x1="24" y1="66" x2="32" y2="66" stroke="#4ade80" stroke-width="1.2" stroke-linecap="round"/>
            <text x="43" y="64" font-size="9" font-family="monospace" font-weight="bold" fill="#94a3b8" text-anchor="middle">_</text>
            <line x1="39" y1="66" x2="47" y2="66" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="game-name">Hangman</span>
      </a>
      <a href="/tictactoe" class="game-card">
        <span class="game-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 54 54" width="54" height="54"
               style="display:block;margin:0 auto" aria-hidden="true">
            <!-- Grid lines -->
            <line x1="18" y1="1"  x2="18" y2="53" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="36" y1="1"  x2="36" y2="53" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="1"  y1="18" x2="53" y2="18" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="1"  y1="36" x2="53" y2="36" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>
            <!-- X top-left (9,9) -->
            <line x1="4"  y1="4"  x2="14" y2="14" stroke="#f87171" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="14" y1="4"  x2="4"  y2="14" stroke="#f87171" stroke-width="2.5" stroke-linecap="round"/>
            <!-- X center (27,27) -->
            <line x1="22" y1="22" x2="32" y2="32" stroke="#f87171" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="32" y1="22" x2="22" y2="32" stroke="#f87171" stroke-width="2.5" stroke-linecap="round"/>
            <!-- X bottom-right (45,45) -->
            <line x1="40" y1="40" x2="50" y2="50" stroke="#f87171" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="50" y1="40" x2="40" y2="50" stroke="#f87171" stroke-width="2.5" stroke-linecap="round"/>
            <!-- O top-right (45,9) -->
            <circle cx="45" cy="9"  r="6" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
            <!-- O middle-left (9,27) -->
            <circle cx="9"  cy="27" r="6" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
          </svg>
        </span>
        <span class="game-name">Tic-Tac-Toe</span>
      </a>
      <a href="/rps" class="game-card">
        <span class="game-icon" style="font-size:1.5rem;letter-spacing:0.1em">✊✋✌️</span>
        <span class="game-name">Rock Paper Scissors</span>
      </a>
      <a href="/connectfour" class="game-card">
        <span class="game-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 58" width="80" height="58"
               style="display:block;margin:0 auto" aria-hidden="true">
            <rect width="80" height="58" rx="6" fill="#1d4ed8"/>
            <!-- top row -->
            <circle cx="10" cy="11" r="6" fill="#1e293b"/>
            <circle cx="24" cy="11" r="6" fill="#f87171"/>
            <circle cx="38" cy="11" r="6" fill="#1e293b"/>
            <circle cx="52" cy="11" r="6" fill="#1e293b"/>
            <circle cx="66" cy="11" r="6" fill="#1e293b"/>
            <!-- middle row -->
            <circle cx="10" cy="29" r="6" fill="#f87171"/>
            <circle cx="24" cy="29" r="6" fill="#fbbf24"/>
            <circle cx="38" cy="29" r="6" fill="#f87171"/>
            <circle cx="52" cy="29" r="6" fill="#1e293b"/>
            <circle cx="66" cy="29" r="6" fill="#fbbf24"/>
            <!-- bottom row -->
            <circle cx="10" cy="47" r="6" fill="#f87171"/>
            <circle cx="24" cy="47" r="6" fill="#f87171"/>
            <circle cx="38" cy="47" r="6" fill="#fbbf24"/>
            <circle cx="52" cy="47" r="6" fill="#fbbf24"/>
            <circle cx="66" cy="47" r="6" fill="#fbbf24"/>
            <!-- shine dots on colored pieces -->
            <circle cx="8"  cy="9"  r="2" fill="rgba(255,255,255,0.25)"/>
            <circle cx="22" cy="9"  r="2" fill="rgba(255,255,255,0.25)"/>
            <circle cx="8"  cy="27" r="2" fill="rgba(255,255,255,0.25)"/>
            <circle cx="22" cy="27" r="2" fill="rgba(255,255,255,0.25)"/>
            <circle cx="36" cy="27" r="2" fill="rgba(255,255,255,0.25)"/>
            <circle cx="64" cy="27" r="2" fill="rgba(255,255,255,0.25)"/>
            <circle cx="8"  cy="45" r="2" fill="rgba(255,255,255,0.25)"/>
            <circle cx="22" cy="45" r="2" fill="rgba(255,255,255,0.25)"/>
            <circle cx="36" cy="45" r="2" fill="rgba(255,255,255,0.25)"/>
            <circle cx="50" cy="45" r="2" fill="rgba(255,255,255,0.25)"/>
            <circle cx="64" cy="45" r="2" fill="rgba(255,255,255,0.25)"/>
          </svg>
        </span>
        <span class="game-name">Connect Four</span>
      </a>
      <a href="/simonsays" class="game-card">
        <span class="game-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 68 68" width="68" height="68"
               style="display:block;margin:0 auto" aria-hidden="true">
            <!-- 2×2 Simon circles matching the actual button layout -->
            <circle cx="18" cy="18" r="14" fill="#1a3a2a" stroke="#4ade80" stroke-width="2.5"/>
            <circle cx="50" cy="18" r="14" fill="#3a1a1a" stroke="#f87171" stroke-width="2.5"/>
            <circle cx="18" cy="50" r="14" fill="#3a3a1a" stroke="#fbbf24" stroke-width="2.5"/>
            <circle cx="50" cy="50" r="14" fill="#1a1a3a" stroke="#60a5fa" stroke-width="2.5"/>
            <!-- One circle lit to suggest a sequence in progress -->
            <circle cx="18" cy="18" r="14" fill="#4ade80" opacity="0.85"/>
          </svg>
        </span>
        <span class="game-name">Simon Says</span>
      </a>
      <a href="/wordle" class="game-card">
        <span class="game-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 68 68" width="68" height="68"
               style="display:block;margin:0 auto" aria-hidden="true">
            <!-- 5 Wordle-style letter tiles in a row -->
            <!-- W — correct (green) -->
            <rect x="2"  y="24" width="11" height="21" rx="2" fill="#538d4e"/>
            <text x="7.5"  y="39" font-size="11" font-family="monospace" font-weight="bold"
                  fill="#fff" text-anchor="middle">W</text>
            <!-- O — present (yellow) -->
            <rect x="15" y="24" width="11" height="21" rx="2" fill="#b59f3b"/>
            <text x="20.5" y="39" font-size="11" font-family="monospace" font-weight="bold"
                  fill="#fff" text-anchor="middle">O</text>
            <!-- R — absent (gray) -->
            <rect x="28" y="24" width="11" height="21" rx="2" fill="#3a3a3c"/>
            <text x="33.5" y="39" font-size="11" font-family="monospace" font-weight="bold"
                  fill="#e2e8f0" text-anchor="middle">R</text>
            <!-- D — correct (green) -->
            <rect x="41" y="24" width="11" height="21" rx="2" fill="#538d4e"/>
            <text x="46.5" y="39" font-size="11" font-family="monospace" font-weight="bold"
                  fill="#fff" text-anchor="middle">D</text>
            <!-- E — present (yellow) -->
            <rect x="54" y="24" width="11" height="21" rx="2" fill="#b59f3b"/>
            <text x="59.5" y="39" font-size="11" font-family="monospace" font-weight="bold"
                  fill="#fff" text-anchor="middle">E</text>
          </svg>
        </span>
        <span class="game-name">Wordle</span>
      </a>
      <a href="/blackjack" class="game-card">
        <span class="game-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 68 68" width="68" height="68"
               style="display:block;margin:0 auto" aria-hidden="true">
            <!-- Back card (offset slightly right/down) -->
            <rect x="20" y="12" width="34" height="46" rx="4" fill="#1d4ed8" stroke="#1e40af" stroke-width="1.5"/>
            <!-- Front card (white) -->
            <rect x="12" y="8"  width="34" height="46" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
            <!-- Rank top-left -->
            <text x="18" y="23" font-size="12" font-family="monospace" font-weight="bold" fill="#0f172a">A</text>
            <!-- Spade center -->
            <text x="29" y="38" font-size="16" font-family="serif" fill="#0f172a" text-anchor="middle">♠</text>
            <!-- "21" hint in accent color -->
            <text x="29" y="52" font-size="9"  font-family="system-ui,sans-serif" font-weight="700"
                  fill="#4ade80" text-anchor="middle">21</text>
          </svg>
        </span>
        <span class="game-name">Blackjack</span>
      </a>
      <a href="/memory" class="game-card">
        <span class="game-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 68 68" width="68" height="68"
               style="display:block;margin:0 auto" aria-hidden="true">
            <!-- 2x2 grid of cards: top-left & bottom-right face-down, others face-up -->
            <!-- top-left face-down -->
            <rect x="4"  y="4"  width="28" height="28" rx="4" fill="#334155"/>
            <text x="18" y="23" font-size="16" text-anchor="middle" fill="#475569">?</text>
            <!-- top-right face-up with cow -->
            <rect x="36" y="4"  width="28" height="28" rx="4" fill="#1d4ed8"/>
            <text x="50" y="24" font-size="18" text-anchor="middle">🐄</text>
            <!-- bottom-left face-up with cow (matched) -->
            <rect x="4"  y="36" width="28" height="28" rx="4" fill="#166534"/>
            <text x="18" y="56" font-size="18" text-anchor="middle">🐄</text>
            <!-- bottom-right face-down -->
            <rect x="36" y="36" width="28" height="28" rx="4" fill="#334155"/>
            <text x="50" y="55" font-size="16" text-anchor="middle" fill="#475569">?</text>
          </svg>
        </span>
        <span class="game-name">Memory Match</span>
      </a>
      <a href="/wordscramble" class="game-card">
        <span class="game-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 68 68" width="68" height="68"
               style="display:block;margin:0 auto" aria-hidden="true">
            <!-- 4 jumbled letter tiles spelling a scrambled word -->
            <rect x="2"  y="24" width="15" height="20" rx="3" fill="#334155" transform="rotate(-8 9.5 34)"/>
            <text x="9.5" y="38" font-size="12" font-family="monospace" font-weight="bold"
                  fill="#e2e8f0" text-anchor="middle" transform="rotate(-8 9.5 34)">C</text>
            <rect x="19" y="20" width="15" height="20" rx="3" fill="#1d4ed8" transform="rotate(6 26.5 30)"/>
            <text x="26.5" y="34" font-size="12" font-family="monospace" font-weight="bold"
                  fill="#fff" text-anchor="middle" transform="rotate(6 26.5 30)">A</text>
            <rect x="36" y="26" width="15" height="20" rx="3" fill="#334155" transform="rotate(-4 43.5 36)"/>
            <text x="43.5" y="40" font-size="12" font-family="monospace" font-weight="bold"
                  fill="#e2e8f0" text-anchor="middle" transform="rotate(-4 43.5 36)">T</text>
            <rect x="51" y="21" width="15" height="20" rx="3" fill="#1d4ed8" transform="rotate(9 58.5 31)"/>
            <text x="58.5" y="35" font-size="12" font-family="monospace" font-weight="bold"
                  fill="#fff" text-anchor="middle" transform="rotate(9 58.5 31)">?</text>
          </svg>
        </span>
        <span class="game-name">Word Scramble</span>
      </a>
      <a href="/tetris" class="game-card">
        <span class="game-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 68 68" width="68" height="68"
               style="display:block;margin:0 auto" aria-hidden="true">
            <!-- falling T-piece -->
            <rect x="21" y="6"  width="12" height="12" rx="2" fill="#a855f7"/>
            <rect x="8"  y="19" width="12" height="12" rx="2" fill="#a855f7"/>
            <rect x="21" y="19" width="12" height="12" rx="2" fill="#a855f7"/>
            <rect x="34" y="19" width="12" height="12" rx="2" fill="#a855f7"/>
            <!-- settled stack -->
            <rect x="8"  y="45" width="12" height="12" rx="2" fill="#22d3ee"/>
            <rect x="21" y="45" width="12" height="12" rx="2" fill="#facc15"/>
            <rect x="34" y="45" width="12" height="12" rx="2" fill="#4ade80"/>
            <rect x="8"  y="58" width="12" height="12" rx="2" fill="#facc15"/>
            <rect x="21" y="58" width="12" height="12" rx="2" fill="#f87171"/>
            <rect x="34" y="58" width="12" height="12" rx="2" fill="#3b82f6"/>
            <rect x="47" y="58" width="12" height="12" rx="2" fill="#fb923c"/>
          </svg>
        </span>
        <span class="game-name">Tetris</span>
      </a>
      <a href="/crossword" class="game-card">
        <span class="game-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 68 68" width="68" height="68"
               style="display:block;margin:0 auto" aria-hidden="true">
            <!-- mini crossword: COW (down) crossing CAT (across) at the shared C -->
            <rect x="6"  y="6"  width="14" height="14" rx="2" fill="#f8fafc"/>
            <text x="13" y="17" font-size="11" font-family="monospace" font-weight="bold"
                  fill="#0f172a" text-anchor="middle">C</text>
            <rect x="22" y="6"  width="14" height="14" rx="2" fill="#f8fafc"/>
            <text x="29" y="17" font-size="11" font-family="monospace" font-weight="bold"
                  fill="#0f172a" text-anchor="middle">A</text>
            <rect x="38" y="6"  width="14" height="14" rx="2" fill="#f8fafc"/>
            <text x="45" y="17" font-size="11" font-family="monospace" font-weight="bold"
                  fill="#0f172a" text-anchor="middle">T</text>
            <rect x="6"  y="22" width="14" height="14" rx="2" fill="#f8fafc"/>
            <text x="13" y="33" font-size="11" font-family="monospace" font-weight="bold"
                  fill="#0f172a" text-anchor="middle">O</text>
            <rect x="6"  y="38" width="14" height="14" rx="2" fill="#f8fafc"/>
            <text x="13" y="49" font-size="11" font-family="monospace" font-weight="bold"
                  fill="#0f172a" text-anchor="middle">W</text>
          </svg>
        </span>
        <span class="game-name">Kids Crossword</span>
      </a>
      <a href="/matchstick" class="game-card">
        <span class="game-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 68 68" width="68" height="68"
               style="display:block;margin:0 auto" aria-hidden="true">
            <!-- three crossed matchsticks with red tips -->
            <line x1="14" y1="54" x2="50" y2="14" stroke="#b45309" stroke-width="5" stroke-linecap="round"/>
            <circle cx="50" cy="14" r="4" fill="#dc2626"/>
            <line x1="54" y1="54" x2="18" y2="14" stroke="#b45309" stroke-width="5" stroke-linecap="round"/>
            <circle cx="18" cy="14" r="4" fill="#dc2626"/>
            <line x1="10" y1="40" x2="58" y2="28" stroke="#b45309" stroke-width="5" stroke-linecap="round"/>
            <circle cx="58" cy="28" r="4" fill="#dc2626"/>
          </svg>
        </span>
        <span class="game-name">Matchstick Equation</span>
      </a>
    </div>
  </main>

  <script src="launcher.js"></script>
</body>
</html>
