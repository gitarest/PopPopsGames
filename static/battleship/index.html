<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Battleship — Pop Pop's Games</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <h1>Battleship</h1>

    <div id="score" class="score" aria-label="Score">
      <div class="score-side">
        <button id="name-btn" class="score-label name-btn" aria-label="Set player name">Guest</button>
        <input id="name-input" class="name-input" type="text" placeholder="Enter name…" autocomplete="off" hidden>
        <ul id="name-list" class="name-list" hidden></ul>
        <span id="score-player" class="score-num">0</span>
      </div>
      <span class="score-vs">vs</span>
      <div class="score-side">
        <span class="score-label">Computer</span>
        <span id="score-hangman" class="score-num">0</span>
      </div>
    </div>

    <div id="level-toggle" class="level-toggle" aria-label="Difficulty"></div>

    <div id="result" class="result" hidden></div>

    <section class="board-section">
      <div class="board-header">
        <h2>Enemy Waters <span class="ships-left">(<strong id="enemy-left">5</strong> ships left)</span></h2>
      </div>
      <p class="hint">Tap a cell to fire!</p>
      <div class="board-body">
        <div id="enemy-grid" class="grid" aria-label="Enemy waters grid"></div>
        <ul id="enemy-fleet-list" class="fleet-list" aria-label="Enemy fleet roster"></ul>
      </div>
    </section>

    <section class="board-section">
      <div class="board-header">
        <h2>Your Fleet <span class="ships-left">(<strong id="your-left">5</strong> ships left)</span></h2>
        <button id="randomize" class="action-btn secondary">🎲 Randomize My Ships</button>
      </div>
      <div class="board-body">
        <div id="player-grid" class="grid" aria-label="Your fleet grid"></div>
      </div>
    </section>

    <div class="actions">
      <button id="new-game" class="new-game">New Game</button>
    </div>

    <a href="/" class="home-btn" aria-label="Home">
      <img src="/logo.png" alt="Pop Pop's Games">
    </a>
  </main>
  <script src="script.js"></script>
</body>
</html>
